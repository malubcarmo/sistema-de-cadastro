<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro de Alunos</title>
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        /* Título centralizado */
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        /* Campos organizados visualmente */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        /* Botão estilizado */
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        /* Efeito hover no botão */
        button:hover {
            background-color: #0056b3;
        }

        /* Área de resultado destacada */
        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none; /* Escondido até ter uma ação */
        }

        .sucesso {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .sucesso h3 {
            margin-bottom: 10px;
        }

        .erro {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cadastro de Aluno</h1>

        <div class="form-group">
            <label for="nome">Nome do aluno:</label>
            <input type="text" id="nome" placeholder="Ex: João Silva">
        </div>

        <div class="form-group">
            <label for="matricula">Matrícula:</label>
            <input type="text" id="matricula" placeholder="Ex: 20250001">
        </div>

        <div class="form-group">
            <label for="curso">Curso:</label>
            <input type="text" id="curso" placeholder="Ex: Engenharia de Software">
        </div>

        <button onclick="cadastrarAluno()">Cadastrar</button>

        <div id="resultado"></div>
    </div>

    <script>
        // Função (function)
        function cadastrarAluno() {
            // Uso de document.getElementById() e .value
            // Uso de Variáveis (let)
            let nomeValor = document.getElementById("nome").value;
            let matriculaValor = document.getElementById("matricula").value;
            let cursoValor = document.getElementById("curso").value;
            
            // Capturando a div de resultado
            let areaResultado = document.getElementById("resultado");

            // Estrutura condicional (if / else)
            // Verificando se os campos estão vazios
            if (nomeValor === "" || matriculaValor === "" || cursoValor === "") {
                // Caso exista algum campo vazio, exibe mensagem de erro
                areaResultado.className = "erro";
                areaResultado.style.display = "block"; // Torna a div visível
                
                // Uso de .innerHTML
                areaResultado.innerHTML = "<strong>Erro:</strong> Por favor, preencha todos os campos do formulário.";
            } else {
                // Caso todos os campos estejam preenchidos, exibe os dados
                areaResultado.className = "sucesso";
                areaResultado.style.display = "block"; // Torna a div visível
                
                // Uso de .innerHTML para injetar a formatação de sucesso
                areaResultado.innerHTML = `
                    <h3>Aluno cadastrado com sucesso!</h3>
                    <p><strong>Nome:</strong> ${nomeValor}</p>
                    <p><strong>Matrícula:</strong> ${matriculaValor}</p>
                    <p><strong>Curso:</strong> ${cursoValor}</p>
                `;

                // Opcional: limpar os campos após o cadastro
                document.getElementById("nome").value = "";
                document.getElementById("matricula").value = "";
                document.getElementById("curso").value = "";
            }
        }
    </script>

</body>
</html>
